<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qui est-ce ?</title>
<meta name="author" content="Jan Wilsker-Wiesen">
<meta name="description" content="Jeu de devinettes pour l'Unité 1 de Découvertes 2 : les vêtements, les couleurs et le look. Un jeu de Jan Wilsker-Wiesen, créé avec Claude.">
<meta name="theme-color" content="#2d4c9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qui est-ce ?">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-size:16px}
img{max-width:100%}
/* Layout: a blue game-board tray of flip cards on the left, a question-builder console on the right; stacks on portrait/phone. */
:root{
  --paper:#eef1f8; --panel:#ffffff; --ink:#1d2340; --muted:#5b6487; --line:#d6dbea;
  --board:#2d4c9e; --board-deep:#213a7e; --card:#fffdf7; --plate:#f3eedf;
  --accent:#ffc53d; --accent-ink:#3b2a00; --yes:#2c9a59; --no:#d2453a; --chip:#f2f4fa; --tag:#e8ecf7;
  --display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12162a; --panel:#1b2038; --ink:#e9ecf8; --muted:#a0a8c8; --line:#2f3656;
  --board:#22397d; --board-deep:#182a60; --card:#fbf7ec; --plate:#ece5d1;
  --accent:#ffc53d; --accent-ink:#3b2a00; --yes:#43b673; --no:#ec6a5f; --chip:#252b48; --tag:#2a3150; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12162a; --panel:#1b2038; --ink:#e9ecf8; --muted:#a0a8c8; --line:#2f3656;
  --board:#22397d; --board-deep:#182a60; --card:#fbf7ec; --plate:#ece5d1;
  --accent:#ffc53d; --accent-ink:#3b2a00; --yes:#43b673; --no:#ec6a5f; --chip:#252b48; --tag:#2a3150; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border-radius:14px;padding:12px 18px;font-weight:800;background:var(--chip);color:var(--ink);border:2px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.blue{background:var(--board);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px}

/* ---------- accueil ---------- */
.start{display:grid;gap:24px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;padding-top:12px}
@media (max-width:860px){.start{grid-template-columns:1fr}}
.hero h1{font-size:clamp(44px,7vw,76px);font-weight:800;letter-spacing:-.5px}
.hero h1 .q{color:var(--board);display:inline-block;transform:rotate(8deg)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:34em;line-height:1.5;margin:10px 0 0}
.parade{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap}
.parade svg{width:62px;height:auto;background:var(--card);border-radius:12px;border:2px solid var(--line)}
.modes{display:grid;gap:14px}
.mode{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px}
.mode h2{font-size:26px}
.mode p{margin:0;color:var(--muted);line-height:1.45}
.mode ol{margin:0;padding-left:20px;color:var(--muted);line-height:1.5}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow label{font-weight:800}
#codeInput{font-family:var(--display);font-size:28px;font-weight:800;width:5.2em;text-align:center;letter-spacing:4px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:4px 8px;font-variant-numeric:tabular-nums}
.src{font-size:13px;color:var(--muted);margin:14px 0 0}
.credit{font-size:14px;color:var(--muted);margin:6px 0 0;padding-top:10px;border-top:2px dashed var(--line);max-width:34em}
.credit b{color:var(--ink);font-family:var(--display);font-size:16px}

/* ---------- jeu ---------- */
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{font-size:28px}
.topbar .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.pill b{font-family:var(--display);font-size:18px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:980px){.game{grid-template-columns:1fr}}
.board{background:var(--board);border-radius:22px;padding:12px;box-shadow:inset 0 -6px 0 var(--board-deep);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
@media (max-width:560px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:9px}}
.boardbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 4px 0}
.boardnote{color:var(--muted);font-size:14px;margin:0;min-width:0;flex:1 1 220px}
.card{border:0;padding:0;background:none;display:block;width:100%}
.card .inner{position:relative;transform-origin:50% 50%}
.card .face{background:var(--card);border:2px solid rgba(0,0,0,.12);display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.card .face svg{display:block;width:100%;height:auto}
.card .name{background:var(--plate);color:#1d2340;font-family:var(--display);font-weight:700;font-size:15px;padding:2px 0 1px;text-align:center;border-top:2px solid rgba(0,0,0,.08)}
/* dos de la carte : simple motif, le prénom en petit en bas */
.card .back{position:absolute;inset:0;display:none;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--board-deep) 0 10px,#1a2f68 10px 20px);border:2px solid rgba(255,255,255,.18);flex-direction:column;justify-content:flex-end}
.card .back span{display:block;text-align:center;font-family:var(--display);font-weight:700;font-size:13px;color:rgba(255,255,255,.6);padding:2px 0 3px;background:rgba(0,0,0,.18)}
.card.flipped .face{visibility:hidden}
.card.flipped .back{display:flex}
.board.guessing .card:not(.flipped) .face{outline:3px dashed var(--accent);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.card .inner{transition:none}}

.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:980px){.side{position:static}}
.box{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.box h3{font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 11px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip i{font-style:normal;font-weight:600;opacity:.6}
.sw{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1 1 auto;border:2px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 6px;font-weight:800;font-size:14px}
.tab.on{background:var(--board);border-color:var(--board);color:#fff}
.sentence{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;background:var(--paper);border-radius:14px;padding:12px 14px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sentence.empty{color:var(--muted);font-family:var(--body);font-size:15px;font-weight:600}
.sentence mark{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:4px;text-underline-offset:3px}
.hint{font-size:14px;color:var(--muted);margin:0;line-height:1.4}
.hint b{color:var(--ink)}
.speak{flex:none;border:0;background:var(--accent);color:var(--accent-ink);width:42px;height:42px;border-radius:50%;font-size:19px;display:grid;place-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.bubble{border-radius:16px;padding:12px 14px;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2}
.bubble.cpu{background:var(--board);color:#fff}
.bubble.yes{background:color-mix(in srgb,var(--yes) 18%,var(--panel));border:2px solid var(--yes)}
.bubble.no{background:color-mix(in srgb,var(--no) 14%,var(--panel));border:2px solid var(--no)}
.fb{font-size:15px;line-height:1.4;margin:0}
.fb.ok{color:var(--yes);font-weight:800}
.fb.bad{color:var(--no);font-weight:800}
.answers{display:grid;grid-template-columns:1fr;gap:8px}
.answers .btn{font-family:var(--display);font-size:18px;padding:10px;text-align:left}
.answers .btn.wrong{opacity:1;text-decoration:line-through;color:var(--no);border-color:var(--no);background:color-mix(in srgb,var(--no) 10%,var(--panel))}
.secret{display:flex;gap:12px;align-items:center}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(10,14,32,.75);display:grid;place-items:center;padding:16px;cursor:zoom-out;animation:zin .2s ease-out}
.zoom .zcard{width:min(80vw,30vh);background:var(--card);border-radius:20px;border:4px solid var(--accent);overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.zoom .zcard svg{display:block;width:100%;height:auto}
.zoom .zcard .name{background:var(--plate);color:#1d2340;text-align:center;font-family:var(--display);font-weight:800;font-size:26px}
.zoom p{color:#fff;font-weight:700;margin:12px 0 0;text-align:center}
@keyframes zin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.zoom{animation:none}}
.secret .mini{width:84px;flex:none;padding:0;cursor:zoom-in;border-radius:12px;overflow:hidden;background:var(--card);border:2px solid var(--line);position:relative}
.secret .mini svg{display:block;width:100%;height:auto}
.secret .mini.hide::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--board-deep) 0 8px,#1a2f68 8px 16px);color:var(--accent);font-family:var(--display);font-size:36px;font-weight:800}
.secret p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.secret strong{font-family:var(--display);font-size:22px;color:var(--ink);display:block}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;line-height:1.35}
.log .who{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--chip);margin-top:1px}
.log .who.cpu{background:var(--board);color:#fff}
.log em{font-style:normal;font-weight:800}
.count{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stats{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.stats div{display:grid;gap:2px}
.turn{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--yes);box-shadow:0 0 0 4px color-mix(in srgb,var(--yes) 25%,transparent)}
.dot.cpu{background:var(--board);box-shadow:0 0 0 4px color-mix(in srgb,var(--board) 30%,transparent)}
.phr{display:grid;gap:4px;font-size:15px;margin:0;padding:0;list-style:none}
.phr li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.phr li span:last-child{color:var(--muted);flex:none}

/* ---------- fenêtres ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,32,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:22px;padding:22px;max-width:520px;width:100%;max-height:calc(100% - 20px);overflow:auto;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{font-size:28px}
.modal p{margin:0;line-height:1.5;color:var(--muted)}
.modal .big{width:min(190px,55%);margin:0 auto;background:var(--card);border-radius:16px;border:3px solid var(--line);overflow:hidden}
.modal .big svg{display:block;width:100%;height:auto}
.modal .big .name{background:var(--plate);color:#1d2340;text-align:center;font-family:var(--display);font-weight:800;font-size:22px}
.duo{display:flex;gap:14px;justify-content:center}
.duo .big{width:150px;margin:0}
.duo figure{margin:0;display:grid;gap:6px;justify-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px}
.gloss h3{grid-column:1/-1;font-size:20px;margin-top:8px}
.gloss .note{grid-column:1/-1;font-size:14px;color:var(--muted);margin:0}
.gloss div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-size:15px}
.gloss div span:first-child{font-weight:800}
.gloss div span:last-child{color:var(--muted);text-align:right}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--tag);color:var(--muted);border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.modal.wide{max-width:780px}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
const NB=' '; // espace insécable avant ? ! : et dans « »
const Q=t=>`«${NB}${t}${NB}»`;
// ---------------- vocabulaire (Découvertes 2, Unité 1, Atelier B) ----------------
// formes : [m. sg., f. sg., m. pl., f. pl.]
const COLORS={
  rouge:{hex:'#d8473b',f:['rouge','rouge','rouges','rouges'],de:'rot'},
  bleu:{hex:'#3b6fc6',f:['bleu','bleue','bleus','bleues'],de:'blau'},
  vert:{hex:'#3f9a59',f:['vert','verte','verts','vertes'],de:'grün'},
  jaune:{hex:'#f1c232',f:['jaune','jaune','jaunes','jaunes'],de:'gelb'},
  noir:{hex:'#2d2d33',f:['noir','noire','noirs','noires'],de:'schwarz'},
  blanc:{hex:'#f7f7f3',f:['blanc','blanche','blancs','blanches'],de:'weiß'},
  gris:{hex:'#9a9ca3',f:['gris','grise','gris','grises'],de:'grau'},
  orange:{hex:'#ef8b31',f:['orange','orange','orange','orange'],de:'orange'},
  marron:{hex:'#7d4f2e',f:['marron','marron','marron','marron'],de:'braun'}
};
const CK=Object.keys(COLORS);
const HAIR={brun:{hex:'#7a4a2a',f:'bruns'},blond:{hex:'#ecc15e',f:'blonds'},roux:{hex:'#cf5a26',f:'roux'},noir:{hex:'#26222a',f:'noirs'}};
const LEN={long:'longs',court:'courts'};
const EYES={bleu:{hex:'#3d7fd1',f:'bleus'},vert:{hex:'#3f9a59',f:'verts'},marron:{hex:'#6b4126',f:'marron'}};
const ITEMS={
  'casquette':{g:'f',de:'Mütze, Kappe',slot:'head',extra:true},
  'lunettes':{g:'f',pl:true,de:'Brille',slot:'glasses'},
  't-shirt':{g:'m',de:'T-Shirt',slot:'top'},
  'chemise':{g:'f',de:'Hemd',slot:'top'},
  'chemisier':{g:'m',de:'Bluse',slot:'top'},
  'pull':{g:'m',de:'Pulli',slot:'top'},
  'sweat-shirt':{g:'m',de:'Sweatshirt',slot:'top',extra:true},
  'veste':{g:'f',de:'Jacke',slot:'top'},
  'anorak':{g:'m',de:'Anorak',slot:'top'},
  'robe':{g:'f',de:'Kleid',slot:'top'},
  'pantalon':{g:'m',de:'Hose',slot:'bottom'},
  'pantalon baggy':{g:'m',de:'weite Hose, Baggy',slot:'bottom',extra:true},
  'jean':{g:'m',de:'Jeans',slot:'bottom'},
  'jupe':{g:'f',de:'Rock',slot:'bottom'},
  'short':{g:'m',de:'Shorts, kurze Hose',slot:'bottom',extra:true},
  'chaussettes':{g:'f',pl:true,de:'Socken',slot:'socks',extra:true},
  'chaussures':{g:'f',pl:true,de:'Schuhe',slot:'shoes'}
};
const NAMES_M=['Hugo','Lucas','Théo','Nathan','Louis','Jules','Tom','Hakim','Malik','Enzo','Léo','Paul','Noah','Gabriel','Yanis','Adam'];
const NAMES_F=['Lola','Zoé','Léa','Chloé','Manon','Camille','Inès','Ada','Emma','Jade','Louise','Alice','Sarah','Lina','Clara','Yasmine'];
const SKIN=['#f7d6b8','#eab88d','#cf9567','#a06842','#6e452b'];
const INK='#2a2633';

const adj=(color,item)=>COLORS[color].f[(ITEMS[item].pl?2:0)+(ITEMS[item].g==='f'?1:0)];
const art=item=>ITEMS[item].pl?'des':ITEMS[item].g==='f'?'une':'un';
const deArt=item=>/^[aeiouhéè]/i.test(item)?"d'":'de ';

// ---------------- hasard reproductible ----------------
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const rep=(v,n)=>Array(n).fill(v);
const bag=(r,spec)=>shuffle(r,spec.flatMap(([v,n])=>rep(v,n)));

// Répartition équilibrée : chaque trait apparaît sur un nombre fixe de cartes,
// chaque couleur revient à peu près aussi souvent que les autres.
function generate(code){
  const r=mulberry(hashStr('qec-'+code));
  const deck=(()=>{let d=[];return(avoid)=>{if(!d.length)d=shuffle(r,CK);let i=d.findIndex(c=>!avoid||!avoid.includes(c));if(i<0){d=d.concat(shuffle(r,CK));i=d.findIndex(c=>!avoid.includes(c))}return d.splice(i,1)[0]}})();
  const people=[];
  for(const g of ['m','f']){
    const names=shuffle(r,g==='m'?NAMES_M:NAMES_F).slice(0,12);
    const tops=g==='m'?bag(r,[['t-shirt',2],['chemise',2],['pull',2],['sweat-shirt',2],['veste',2],['anorak',2]])
                      :bag(r,[['robe',2],['chemisier',2],['t-shirt',2],['pull',2],['sweat-shirt',2],['veste',1],['anorak',1]]);
    const bottoms=g==='m'?bag(r,[['pantalon',3],['pantalon baggy',3],['jean',3],['short',3]])
                         :bag(r,[['jupe',3],['jean',2],['pantalon',2],['short',2],['pantalon baggy',1]]);
    const lens=g==='m'?bag(r,[['long',4],['court',8]]):bag(r,[['long',8],['court',4]]);
    const glasses=bag(r,[[true,3],[false,9]]),caps=bag(r,[[true,3],[false,9]]);
    let bi=0;
    for(let i=0;i<12;i++){
      const topT=tops[i];
      people.push({name:names[i],g,len:lens[i],topT,bottomT:topT==='robe'?null:bottoms[bi++],glasses:glasses[i],cap:caps[i]});
    }
  }
  const hairs=bag(r,[['brun',7],['noir',7],['blond',6],['roux',4]]);
  const eyes=bag(r,[['marron',9],['bleu',8],['vert',7]]);
  const bare=people.filter(p=>!p.bottomT||p.bottomT==='jupe'||p.bottomT==='short');
  const sockSet=new Set(shuffle(r,bare).slice(0,Math.min(6,bare.length)));
  const seen=new Set();
  const out=people.map((p,i)=>{
    const top={type:p.topT,color:deck()};
    let bottom=null;

const pron=c=>c.g==='m'?'il':'elle';
function worn(c,item){
  const slot=ITEMS[item].slot;
  const o=slot==='head'?c.head:slot==='glasses'?c.glasses:slot==='top'?c.top:slot==='bottom'?c.bottom:slot==='socks'?c.socks:c.shoes;
  if(!o)return null;
  if(item==='pantalon'&&o.type==='pantalon baggy')return o; // un baggy est aussi un pantalon
  return o.type===item?o:null;
}
function evalQ(c,q){
  switch(q.kind){
    case'wear':{const o=worn(c,q.item);if(!o)return false;return q.color?o.color===q.color:true}
    case'hair':return(!q.len||c.hair.len===q.len)&&(!q.color||c.hair.color===q.color);
    case'eyes':return c.eyes===q.color;
    case'garcon':return c.g==='m';
    case'fille':return c.g==='f';
    case'name':return c.id===q.id;
  }
}
function obj(q,mark){
  const m=t=>mark?`<mark>${t}</mark>`:t;
  if(q.kind==='wear')return `${q.item}${q.color?' '+m(adj(q.color,q.item)):''}`;
  if(q.kind==='hair')return 'les cheveux '+[q.len&&m(LEN[q.len]),q.color&&m(HAIR[q.color].f)].filter(Boolean).join(' et ');
  if(q.kind==='eyes')return 'les yeux '+m(EYES[q.color].f);
}
function qText(q,mark){
  switch(q.kind){
    case'wear':return `Est-ce que ton personnage porte ${art(q.item)} ${obj(q,mark)}${NB}?`;
    case'hair':case'eyes':return `Est-ce que ton personnage a ${obj(q,mark)}${NB}?`;
    case'garcon':return `Est-ce que c'est un garçon${NB}?`;
    case'fille':return `Est-ce que c'est une fille${NB}?`;
    case'name':return `Est-ce que c'est ${q.name}${NB}?`;
  }
}
// « mon personnage » au lieu de il / elle : la réponse ne révèle pas si c'est un garçon ou une fille
const SUBJ='mon personnage';
function answerText(q,yes){
  const p=SUBJ;
  switch(q.kind){
    case'wear':return yes?`Oui, ${p} porte ${art(q.item)} ${obj(q)}.`:`Non, ${p} ne porte pas ${deArt(q.item)}${obj(q)}.`;
    case'hair':case'eyes':return yes?`Oui, ${p} a ${obj(q)}.`:`Non, ${p} n'a pas ${obj(q)}.`;
    case'garcon':return yes?"Oui, c'est un garçon.":"Non, c'est une fille.";
    case'fille':return yes?"Oui, c'est une fille.":"Non, c'est un garçon.";
    case'name':return yes?`Oui, c'est ${q.name}${NB}!`:`Non, ce n'est pas ${q.name}.`;
  }
}
// réponses proposées en mode ordinateur, chacune avec son type de faute
function answerOptions(c,q){
  const yes=evalQ(c,q),p=SUBJ;
  const opts=[{t:answerText(q,yes),err:null},{t:answerText(q,!yes),err:'truth'}];
  if(q.kind==='wear'){
    // faute de négation : « pas un / une / des » au lieu de « pas de »
    opts.push({t:`Non, ${p} ne porte pas ${art(q.item)} ${obj(q)}.`,err:yes?'truth':'neg'});
    if(q.color){const wi=(ITEMS[q.item].pl?2:0)+(ITEMS[q.item].g==='f'?0:1);const w=COLORS[q.color].f[wi];
      if(w!==adj(q.color,q.item))opts.push({t:yes?`Oui, ${p} porte ${art(q.item)} ${q.item} ${w}.`:`Non, ${p} ne porte pas ${deArt(q.item)}${q.item} ${w}.`,err:'agree'})}
  }
  if(q.kind==='hair'||q.kind==='eyes'){
    // avec les cheveux / les yeux, on garde « les » après la négation
    opts.push({t:`Non, ${p} n'a pas de ${obj(q).replace(/^les /,'')}.`,err:yes?'truth':'les'});
  }
  const seen=new Set();
  return shuffle(Math.random,opts.filter(o=>!seen.has(o.t)&&seen.add(o.t)).slice(0,4));
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));u.lang='fr-FR';u.rate=.88;const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^fr(-|_)FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function cpuQuestion(rem){
  const cands=[];
  for(const item in ITEMS){cands.push({kind:'wear',item});const cs=new Set(rem.map(c=>worn(c,item)).filter(Boolean).map(o=>o.color));cs.forEach(color=>cands.push({kind:'wear',item,color}))}
  Object.keys(LEN).forEach(len=>cands.push({kind:'hair',len}));
  Object.keys(HAIR).forEach(color=>cands.push({kind:'hair',color}));
  Object.keys(EYES).forEach(color=>cands.push({kind:'eyes',color}));
  cands.push({kind:Math.random()<.5?'garcon':'fille'});
  const n=rem.length;
  const scored=cands.map(q=>{const y=rem.filter(c=>evalQ(c,q)).length;return{q,y,score:Math.abs(y-n/2)+Math.random()*1.2}}).filter(x=>x.y>0&&x.y<n).sort((a,b)=>a.score-b.score);
  const top=scored.slice(0,4);
  return top.length?top[Math.floor(Math.random()*top.length)].q:null;
}

        <div class="row"><button class="btn blue" id="goCpu">Commencer l'entraînement</button></div>

function startGame(mode,code){
  const chars=generate(code);
  const mine=chars[Math.floor(Math.random()*24)];
  S={mode,code,chars,secret:mine,flipped:new Set(),hideSecret:true,tidy:false,guessing:false,log:[],asked:0,
     cpu:mode==='cpu'?{secret:chars[Math.floor(Math.random()*24)],rem:chars.slice()}:null,
     turn:'you',phase:'ask',lastAns:null,cpuQ:null,cpuOpts:null,cpuFb:null};

    <p>${mode==='duo'?`Retiens bien ton personnage et ne montre pas ton iPad à ton ou ta partenaire. Tu peux revoir ta carte à droite.`:`L'ordinateur cherche ton personnage. Toi, tu cherches le personnage de l'ordinateur. Tu commences${NB}!`}</p>

  syncBoard();renderSide();

const calm=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
// Les cartes restantes glissent vers leur nouvelle place (technique FLIP)
function slide(mutate){
  const els=[...document.querySelectorAll('.card')];
  const first=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
  mutate();
  if(calm()||!Element.prototype.animate)return;
  els.forEach(e=>{if(e.hidden)return;const f=first.get(e),l=e.getBoundingClientRect();
    if(!f.width){e.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'none'}],{duration:350,easing:'ease-out'});return}
    const dx=f.left-l.left,dy=f.top-l.top;
    if(dx||dy)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.3,.7,.3,1)'})});
}
// La carte se retourne comme une vraie carte : elle se replie, puis on voit l'autre côté.
function flipCard(el,on){
  const inner=el.querySelector('.inner');
  if(calm()||!inner.animate){el.classList.toggle('flipped',on);return}
  inner.getAnimations().forEach(a=>a.cancel());
  inner.animate([{transform:'scaleY(1)'},{transform:'scaleY(0.02)'}],{duration:140,easing:'ease-in'}).onfinish=()=>{
    el.classList.toggle('flipped',on);
    inner.animate([{transform:'scaleY(0.02)'},{transform:'scaleY(1)'}],{duration:180,easing:'ease-out'});
  };
}
function hideLater(el,id){
  setTimeout(()=>{
    if(!S||!S.tidy||!S.flipped.has(id)||el.hidden)return;
    const go=()=>slide(()=>{el.hidden=true});
    if(calm()||!el.animate)return go();
    el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.7)'}],{duration:220,easing:'ease-in'}).onfinish=go;
  },calm()?0:520);
}
function syncBoard(){
  document.querySelectorAll('.card').forEach(el=>{const f=S.flipped.has(+el.dataset.card);el.classList.toggle('flipped',f);el.hidden=S.tidy&&f});
  const b=document.getElementById('board');if(b)b.classList.toggle('guessing',S.guessing);
  const n=document.getElementById('boardnote');
  if(n)n.textContent=S.guessing?'Touche le personnage que tu veux deviner.':S.tidy?'Touche une carte pour la retourner. Les autres cartes se rapprochent.':'Touche une carte pour la retourner. Touche encore une fois pour la remettre.';
  const t=document.getElementById('tidyBtn');
  if(t){t.textContent=S.tidy?`Montrer les cartes retournées (${S.flipped.size})`:'Ranger les cartes retournées';t.disabled=S.tidy&&!S.flipped.size}
}
const standing=()=>24-S.flipped.size;

function agreeHint(q){
  if(!q||q.kind!=='wear'||!q.color)return'';
  const it=ITEMS[q.item],a=adj(q.color,q.item),base=COLORS[q.color].f[0];
  if(q.color==='orange'||q.color==='marron')return `<p class="hint"><b>${q.color}</b> ne change jamais.</p>`;
  const genre=`${it.g==='f'?'féminin':'masculin'} ${it.pl?'pluriel':'singulier'}`;
  if(a===base)return `<p class="hint"><b>${art(q.item)} ${q.item}</b>${NB}: ${genre}. La couleur reste <b>${a}</b>.</p>`;
  return `<p class="hint"><b>${art(q.item)} ${q.item}</b>${NB}: ${genre}. <b>${base}</b> devient <b>${a}</b>.</p>`;
}

    <div class="label">La couleur (si tu veux)</div><div class="chips">${CK.map(c=>`<button class="chip ${B.color===c?'on':''}" data-act="color" data-v="${c}"><span class="sw" style="background:${COLORS[c].hex}"></span>${B.item?adj(c,B.item):c}</button>`).join('')}</div>`;

    <div class="label">Les cheveux${NB}: la couleur</div><div class="chips">${Object.keys(HAIR).map(k=>`<button class="chip ${B.hcol===k?'on':''}" data-act="hcol" data-v="${k}"><span class="sw" style="background:${HAIR[k].hex}"></span>${HAIR[k].f}</button>`).join('')}</div>
    <div class="label">ou${NB}: les yeux</div><div class="chips">${Object.keys(EYES).map(k=>`<button class="chip ${B.eyes===k?'on':''}" data-act="eyes" data-v="${k}"><span class="sw" style="background:${EYES[k].hex}"></span>${EYES[k].f}</button>`).join('')}</div>`;
  }else{
    h+=`<div class="chips"><button class="chip ${B.who==='garcon'?'on':''}" data-act="who" data-v="garcon">un garçon</button><button class="chip ${B.who==='fille'?'on':''}" data-act="who" data-v="fille">une fille</button></div>`;

  return h;
}

        ${S.cpuTry?`<p class="fb bad">Ce n'est pas la bonne réponse. Essaie encore une fois${NB}!</p><p class="fb">${S.cpuTry}</p>`:`<p class="fb">Regarde ton personnage et choisis la bonne réponse${NB}:</p>`}
        <div class="answers">${S.cpuOpts.map((o,i)=>`<button class="btn ${o.tried?'wrong':''}" data-act="cpuAns" data-v="${i}" ${o.tried?'disabled':''}>${o.tried?'✗ ':''}${esc(o.t)}</button>`).join('')}</div></div>`;

const HINTS={
  truth:c=>`Regarde bien${NB}: cette réponse ne va pas avec ${esc(c.name)}.`,
  les:()=>`Avec <b>les cheveux</b> et <b>les yeux</b>, on garde <b>les</b>${NB}: <i>Mon personnage n'a pas les yeux bleus.</i>`,
  neg:()=>`Après <b>ne … pas</b>, <b>un / une / des</b> devient <b>de</b> (<b>d'</b> devant une voyelle)${NB}: <i>Mon personnage ne porte pas de pull.</i>`,
  agree:()=>`La couleur s'accorde avec le vêtement${NB}: <i>une jupe verte, des chaussettes noires</i>.`
};
function cpuStart(){
  const rem=S.cpu.rem;
  if(rem.length<=2){const g=rem[Math.floor(Math.random()*rem.length)];S.cpuQ={kind:'name',id:g.id,name:g.name}}
  else S.cpuQ=cpuQuestion(rem)||{kind:'name',id:rem[0].id,name:rem[0].name};
  S.cpuOpts=answerOptions(S.secret,S.cpuQ);S.cpuFb=null;S.cpuTry='';S.cpuTries=0;S.turn='cpu';renderSide();
}
// Une mauvaise réponse est barrée, l'élève lit l'explication et choisit encore une fois.
function cpuAnswered(i){
  const q=S.cpuQ,yes=evalQ(S.secret,q),correct=answerText(q,yes),o=S.cpuOpts[i];
  if(o.err){o.tried=true;S.cpuTries++;S.cpuTry=HINTS[o.err](S.secret);renderSide();return}
  S.cpuFb={correct,yes,tries:S.cpuTries};S.cpuTry='';
  S.log.push({who:'cpu',q:qText(q),a:correct});
  if(q.kind==='name'&&yes){S.turn='over';renderSide();setTimeout(()=>endModal(false),500);return}
  S.cpu.rem=S.cpu.rem.filter(c=>evalQ(c,q)===yes);
  renderSide();
}
function endModal(youWin){

    <div class="duo"><figure><div class="big">${svgFor(you)}<div class="name">${esc(you.name)}</div></div>ton personnage</figure><figure><div class="big">${svgFor(cpu)}<div class="name">${esc(cpu.name)}</div></div>le personnage du PC</figure></div>

}

  }
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  switch(a){
    case'close':closeModal();break;

    case'reveal':modal(`<h2>Mon personnage</h2><div class="big">${svgFor(S.secret)}<div class="name">${esc(S.secret.name)}</div></div><div class="row"><button class="btn primary" data-act="close">Fermer</button></div>`);break;
    case'ask':{const q=curQ();if(!q)return;const c=S.cpu.secret,yes=evalQ(c,q);S.asked++;
      S.lastAns={q:qText(q),yes,a:answerText(q,yes)};S.log.push({who:'you',q:S.lastAns.q,a:S.lastAns.a});
      S.phase='answered';S.guessing=false;syncBoard();renderSide();speak(S.lastAns.a);break}
    case'endTurn':S.phase='ask';resetBuilder();cpuStart();break;
    case'tidy':slide(()=>{S.tidy=!S.tidy;syncBoard()});break;
    case'guess':S.guessing=!S.guessing;syncBoard();renderSide();break;
    case'confirmGuess':{closeModal();const id=+v,c=S.chars[id];S.asked++;S.guessing=false;
      const right=c.id===S.cpu.secret.id;S.log.push({who:'you',q:`Est-ce que c'est ${c.name}${NB}?`,a:right?`Oui, c'est ${c.name}${NB}!`:`Non, ce n'est pas ${c.name}.`});
      if(right){S.turn='over';syncBoard();renderSide();endModal(true)}
      else{S.flipped.add(id);syncBoard();S.phase='ask';resetBuilder();cpuStart();
        modal(`<h2>Non, ce n'est pas ${esc(c.name)}.</h2><p>Maintenant, c'est le tour de l'ordinateur.</p><div class="row"><button class="btn primary" data-act="close">OK</button></div>`)}
      break}
    case'cpuAns':cpuAnswered(+v);break;
    case'toYou':S.turn='you';S.phase='ask';S.cpuFb=null;renderSide();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();const z=document.getElementById('zoom');if(z)z.remove()}});
try{speechSynthesis.getVoices()}catch(e){}
renderStart();
})();
</script>
